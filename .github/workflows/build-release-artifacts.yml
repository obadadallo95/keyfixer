name: Build Release Artifacts

on:
  workflow_dispatch:


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Run unified release check
        run: npm run release:check
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KeyFixer-1.1.2-web-unsigned-validation
          path: dist/
      - name: Upload Chrome Extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KeyFixer-1.1.2-chrome-unsigned-validation.zip
          path: extension/dist/

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build desktop frontend
        run: npm run build:desktop
      - name: Pre-flight – verify dist-desktop before Tauri packaging
        run: npm run preflight:desktop
      - name: Build macOS unsigned artifact
        run: npm run build:mac-ci
      - name: Validate bundle resources (smoke test)
        run: |
          APP_RESOURCES="src-tauri/target/release/bundle/macos/KeyFixer.app/Contents/Resources"
          echo "════════════════════════════════════════════════════"
          echo "Bundle resource listing:"
          echo "════════════════════════════════════════════════════"
          find "$APP_RESOURCES" -type f | sort
          echo "════════════════════════════════════════════════════"
          echo "Verifying index.html is present..."
          if [ ! -f "$APP_RESOURCES/index.html" ]; then
            echo "❌ FAIL: index.html NOT found in bundle Resources" >&2
            exit 1
          fi
          echo "✅ index.html confirmed in bundle Resources"
          echo "Checking for dev-server references in bundled index.html..."
          if grep -qi "localhost\|127\.0\.0\.1" "$APP_RESOURCES/index.html"; then
            echo "❌ FAIL: bundled index.html contains dev-server references" >&2
            exit 1
          fi
          echo "✅ No dev-server references in bundled index.html"
          echo "Verifying referenced JS/CSS assets exist in bundle..."
          ASSET_REFS=$(grep -oE '(src|href)="/assets/[^"]+"' "$APP_RESOURCES/index.html" | grep -oE '/assets/[^"]+' || true)
          if [ -z "$ASSET_REFS" ]; then
            echo "❌ FAIL: No /assets/ references found in bundled index.html" >&2
            exit 1
          fi
          ASSET_FAIL=0
          while IFS= read -r asset_ref; do
            asset_path="$APP_RESOURCES$asset_ref"
            if [ ! -f "$asset_path" ]; then
              echo "❌ FAIL: Bundled asset missing: $asset_ref" >&2
              ASSET_FAIL=1
            else
              SIZE=$(wc -c < "$asset_path" | tr -d ' ')
              echo "✅ $asset_ref (${SIZE} bytes)"
            fi
          done <<< "$ASSET_REFS"
          if [ "$ASSET_FAIL" -ne 0 ]; then exit 1; fi
          echo "════════════════════════════════════════════════════"
          echo "✅ All bundle resource checks passed."
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KeyFixer-1.1.2-macos-unsigned-validation
          path: src-tauri/target/release/bundle/macos/


  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows NSIS unsigned
        run: |
          npm run build:desktop
          npm run build:windows
      - name: Upload Windows NSIS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-unsigned
          path: src-tauri/target/release/bundle/nsis/

  build-windows-msix:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Windows MSIX
        run: |
          npm run build:desktop
          npm run build:windows:msix
      - name: Generate CI Ephemeral Certificate
        run: |
          $Cert = New-SelfSignedCertificate -Type Custom -Subject "CN=A2B67C57-E9AA-4233-B229-7A21800FE184" -KeyUsage DigitalSignature -FriendlyName "KeyFixer CI Ephemeral Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -HashAlgorithm sha256
          $CertPassword = ConvertTo-SecureString -String "ci-ephemeral-pass" -Force -AsPlainText
          Export-PfxCertificate -Cert $Cert -FilePath "ci-cert.pfx" -Password $CertPassword
      - name: Sign MSIX (CI Ephemeral)
        run: |
          $SdkBinBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          $SignToolPath = ""
          if (Test-Path $SdkBinBase) {
              $Versions = Get-ChildItem -Path $SdkBinBase | Where-Object { $_.Name -match "^10\.0\.\d+\.\d+$" } | Sort-Object -Property Name -Descending
              foreach ($Ver in $Versions) {
                  $Candidate = Join-Path -Path $Ver.FullName -ChildPath "x64\signtool.exe"
                  if (Test-Path $Candidate) {
                      $SignToolPath = $Candidate
                      Write-Host "Found signtool.exe: $SignToolPath"
                      break
                  }
              }
          }
          if (-not $SignToolPath) {
              Write-Error "Could not locate signtool.exe in Windows Kits"
              exit 1
          }
          & $SignToolPath sign /fd sha256 /a /f ci-cert.pfx /p ci-ephemeral-pass src-tauri\target\release\bundle\msix\KeyFixer_1.1.2.0_x64.msix
      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KeyFixer-1.1.2.0-windows-msix-ci-signed-test
          path: src-tauri/target/release/bundle/msix/KeyFixer_1.1.2.0_x64.msix
