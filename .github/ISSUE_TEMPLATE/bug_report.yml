name: 🐛 Bug Report
description: Report an issue, layout conversion bug, or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with KeyFixer! Please fill out the sections below to help us reproduce and resolve the problem.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did you encounter this issue on?
      options:
        - Windows Desktop App (Microsoft Store)
        - Windows Desktop App (NSIS Installer)
        - Chrome Extension (Chrome Web Store)
        - macOS Desktop App
        - Web App (keyfixer.vercel.app)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KeyFixer Version
      description: What version of KeyFixer are you running? (e.g. 1.3.1)
      placeholder: 1.3.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Type `lh h[lg` in the input field
        2. Expected output: `ما اجمل`
        3. Actual output: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any screenshots, OS details, or browser versions here.
