[package]
name = "keyfixer-desktop"
version = "1.3.1"
description = "KeyFixer Desktop — Always-on-top floating keyboard layout fixer"
authors = ["Obada Dallo"]
edition = "2021"

[lib]
name = "keyfixer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keyfixer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-opener = "2"
windows = { version = "0.61", features = [
    "Services_Store",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Storage",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"


[features]
default = ["custom-protocol", "direct"]
custom-protocol = ["tauri/custom-protocol"]
pro = []
direct = ["pro"]
appstore = ["pro"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
